<meta name="mobile-web-app-capable" content="yes">
<script>
/* Resolve the host theme before first paint: same-origin workspace theme, else OS preference. */
(function () {
  var theme = null;
  try {
    var parentWin = window.parent;
    if (parentWin && parentWin !== window) {
      var pdoc = parentWin.document;
      var roots = [pdoc.documentElement, pdoc.body];
      for (var i = 0; i < roots.length && !theme; i++) {
        var el = roots[i];
        if (!el) continue;
        var val = el.getAttribute && (el.getAttribute('data-theme') || el.getAttribute('data-color-mode') ||
          el.getAttribute('data-mode') || el.getAttribute('data-bs-theme'));
        if (val && /dark|night|夜/i.test(val)) theme = 'dark';
        else if (val && /light|day|日/i.test(val)) theme = 'light';
        if (!theme && el.classList) {
          if (el.classList.contains('dark') || el.classList.contains('theme-dark')) theme = 'dark';
          else if (el.classList.contains('light') || el.classList.contains('theme-light')) theme = 'light';
        }
      }
      if (!theme) {
        var scheme = parentWin.getComputedStyle(pdoc.documentElement).colorScheme || '';
        if (/dark/i.test(scheme)) theme = 'dark';
        else if (/light/i.test(scheme)) theme = 'light';
      }
    }
    if (!theme && window.matchMedia) {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  } catch (err) { /* cross-origin parent: fall back to the OS preference */ }
  theme = theme || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme;
})();
</script>
<link rel="stylesheet" href="./app.css">
</head>
